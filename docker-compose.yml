# English Learning Platform — Production Docker Compose
# Usage:
#   docker compose up -d                              (start all services)
#   docker compose logs -f app                        (tail app logs)
#   docker compose up -d --force-recreate --build app (rebuild and restart app)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elp-app
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      TRUST_PROXY: "true"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - /opt/elp/server/uploads:/app/server/uploads
      - /opt/elp/server/logs:/app/server/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - elp-network
    expose:
      - "5000"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:5000/api/health/ready" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: elp-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - elp-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: elp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # SSL certs — persisted across restarts
      - caddy_config:/config
    networks:
      - elp-network
    depends_on:
      - app

volumes:
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  elp-network:
    driver: bridge
