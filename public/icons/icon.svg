<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark background -->
  <rect width="512" height="512" rx="100" fill="#0a0d1f"/>

  <!-- Subtle inner glow -->
  <polygon points="256,52 430,153 430,355 256,456 82,355 82,153"
    fill="rgba(245,200,66,0.07)"/>

  <!-- Gold hexagon ring -->
  <polygon points="256,52 430,153 430,355 256,456 82,355 82,153"
    fill="none" stroke="#f5c842" stroke-width="22"/>

  <!-- Inner thin ring for depth -->
  <polygon points="256,96 394,173 394,329 256,406 118,329 118,173"
    fill="none" stroke="#f5c842" stroke-width="5" opacity="0.28"/>

  <!-- "C" drawn as a thick arc — no font dependency, crisp at any size -->
  <!-- Center 256,256 · radius 100 · open gap on right ~55° each side -->
  <path d="M 322,170 A 104,104 0 1 0 322,342"
    fill="none" stroke="#f5c842" stroke-width="58" stroke-linecap="round"/>
</svg>
