<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" id="vp" />
    <script>
      // App pages (admin/teacher/student/super-admin) use a fixed 1280px desktop
      // viewport so the full UI is visible — users can pinch-zoom to interact.
      // Landing pages keep device-width so they stay mobile-responsive.
      (function () {
        var p = window.location.pathname;
        var isApp = /^\/(admin|teacher|student|parent|sub-admin|super-admin)/.test(p);
        if (isApp) {
          // Phones (screen.width < 768) get device-width so mobile UI renders at actual size.
          // Respect explicit user preference stored in localStorage.
          var saved = null;
          try { saved = localStorage.getItem('viewMode'); } catch (e) { /* private mode */ }
          var isPhone = window.screen.width < 768;
          // Admin, sub-admin and super-admin are desktop-only — no mobile layout, no toggle
          var isAdmin = /^\/(admin|sub-admin|super-admin)(\/|$)/.test(p) &&
            // …except pages opened from an email link (reset password, confirm email, account setup)
            !/^\/(admin|sub-admin)\/(reset-password|email-change|setup)(\/|$)/.test(p);
          // iPad / Android tablet (iPadOS reports as a Mac → detect by touch + screen size).
          // Mirrors isTablet() in src/hooks/useViewMode.js. Only student pages have a
          // tablet layout so far (student, teacher); others keep the 1280px desktop viewport.
          var sw = window.screen.width, sh = window.screen.height;
          var isTablet = !isPhone && navigator.maxTouchPoints > 1 &&
            Math.min(sw, sh) >= 600 && Math.max(sw, sh) <= 1366;
          var tabletReady = /^\/(student|teacher)/.test(p);
          // Admin always uses desktop viewport — no mobile layout for admin
          var useMobile = !isAdmin && (isPhone || (isTablet && tabletReady)) && saved !== 'desktop';
          window.__applyViewport(useMobile);
          window.addEventListener('orientationchange', function () {
            setTimeout(function () { window.__applyViewport(window.__vpMobile); }, 150);
          });
        }
      })();

      // Sets the viewport for the mobile layout (device width) or the 1280px desktop layout.
      // Also called by useViewMode when the layout is switched in Settings.
      function __applyViewport(mobile) {
        var vp = document.getElementById('vp'), root = document.documentElement;
        window.__vpMobile = mobile;
        var sw = screen.width, sh = screen.height;
        var touch = navigator.maxTouchPoints > 0;
        root.classList.remove('desk-touch');
        if (mobile) {
          vp.content = 'width=device-width, initial-scale=1.0, viewport-fit=cover';
        } else if (!touch || Math.min(sw, sh) > 1280) {
          vp.content = 'width=1280, viewport-fit=cover';
        } else {
          // Desktop page on a phone/tablet. Pin the scale to exactly "fit 1280px" so the page
          // never loads half-zoomed and can't be zoomed out past its edges (the sideways
          // wobble). Pinch-zoom IN stays available.
          // iOS also zooms in on every input tap here (all text is < 16px at this scale) and
          // stays zoomed; on iOS only, maximum-scale stops that auto-zoom — iOS still lets the
          // user pinch-zoom regardless. Android doesn't auto-zoom, so it gets no maximum-scale.
          var iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (/Mac/.test(navigator.platform) && navigator.maxTouchPoints > 1);
          var landscape = window.matchMedia('(orientation: landscape)').matches;
          var s = Math.min(1, (landscape ? Math.max(sw, sh) : Math.min(sw, sh)) / 1280).toFixed(4);
          vp.content = 'width=1280, initial-scale=' + s + ', minimum-scale=' + s +
            (iOS ? ', maximum-scale=' + s : '') + ', viewport-fit=cover';
          root.classList.add('desk-touch');
        }
      }
    </script>
    <title>Learning</title>

    <!-- Fonts — loaded here (not via @import in index.css or in components) so the browser fetches
         them in parallel with the JS/CSS bundle instead of after it. Nunito (variable,
         one file for all weights) is the Sunshine dashboards + login pages font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Nunito:wght@400..900&display=swap" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme / status bar -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clemify" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />

    <!-- SEO / share -->
    <meta name="description" content="Clemify — The complete web-based learning platform for English schools" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <!-- ── Google Translate ── -->
    <style>
      /* Hide the blue "Page translated" banner Google injects */
      .goog-te-banner-frame { display: none !important; }
      body { top: 0 !important; }

      /* Clean up the widget container */
      .goog-te-gadget { font-size: 0 !important; }
      .goog-te-gadget > span > a { display: none !important; }

      /* Style the select dropdown */
      .goog-te-gadget select.goog-te-combo {
        font-size: 13px !important;
        font-weight: 600 !important;
        padding: 6px 10px !important;
        border-radius: 9px !important;
        border: 1.5px solid rgba(124,58,237,0.25) !important;
        background: rgba(124,58,237,0.07) !important;
        color: #7c3aed !important;
        cursor: pointer !important;
        outline: none !important;
        font-family: 'Plus Jakarta Sans', sans-serif !important;
        transition: border-color 0.2s !important;
      }
      .goog-te-gadget select.goog-te-combo:hover {
        border-color: #7c3aed !important;
      }

      /* Remove the Google logo */
      .goog-logo-link { display: none !important; }
      .goog-te-gadget img { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ── Google Translate init ── -->
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "en",
            includedLanguages:
              "en,vi,fr,es,de,ar,zh-CN,zh-TW,ja,ko,pt,ru,hi,id,tr,it,nl,pl,sv,th",
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false,
          },
          "google_translate_element"
        );
      }
    </script>
    <!-- async: a third-party script must never delay the app from starting -->
    <script async src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
