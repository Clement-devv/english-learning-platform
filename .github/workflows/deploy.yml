name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        run: cd server && npm ci

      - name: Build frontend (smoke test)
        run: npm run build
        env:
          VITE_API_URL: https://example.com

      - name: Run server tests
        run: cd server && npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-minimum-32-characters-xxxxxxxxxxxxxxxxx
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SESSION_SECRET: test-session-secret-32-chars-xxxxxxxxx
          MONGO_URI: mongodb://localhost:27017/test
          MASTER_DB_URI: mongodb://localhost:27017/master_test
          DB_BASE_URI: mongodb://localhost:27017

  # ── Build & Push Docker Image ────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    # Only build on pushes to main (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=true

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: echo "Built and pushed ${{ steps.meta.outputs.tags }}"

  # ── Deploy to VPS ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://yourplatform.com
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/english-learning-platform

            # Authenticate with GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull the new image
            docker pull ghcr.io/${{ github.repository }}:latest

            # Pull latest docker-compose + Caddyfile from repo
            git pull origin main

            # Rolling restart — new container starts before old one stops
            docker compose up -d --no-build app

            # Wait for health check (max 60s)
            echo "Waiting for health check..."
            for i in $(seq 1 12); do
              if wget -qO- http://localhost:5000/api/health/ready > /dev/null 2>&1; then
                echo "✅ App healthy after ${i} checks"
                break
              fi
              if [ "$i" = "12" ]; then
                echo "❌ Health check failed — check logs with: docker compose logs app"
                exit 1
              fi
              sleep 5
            done

            # Prune old images to save disk space (keep last 3)
            docker image prune -f

            echo "🚀 Deployed commit ${{ github.sha }}"

      - name: Deployment complete
        run: |
          echo "Deployed to production"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
